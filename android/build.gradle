allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // exifinterface 1.4.x (pulled in by image plugins) crashes AGP 7.3's D8 dexer
    // ("NullPointerException ... String.length()"). Pin the last 1.3.x until AGP is upgraded.
    configurations.all {
        resolutionStrategy.force "androidx.exifinterface:exifinterface:1.3.7"
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
